body.dark{--ink:#f1f1f2;--muted:#a4a7ac;--line:#303236;--paper:#0b0c0e;--card:#151619;--card-soft:#101114;--green:#f0f1f2;--green-strong:#fff;--green2:#2a2c30;--orange:#d2d4d8;--red:#ff8f8f;--focus:#c5c8cd;--shadow:0 16px 38px rgba(0,0,0,.38)}body.dark .sidebar{background:#0a0b0d;color:#e7e8ea;box-shadow:8px 0 30px rgba(0,0,0,.18)}body.dark .brand-mark{background:#f0f1f2;color:#111214}body.dark .side-label{color:#858990}body.dark .nav button{color:#aeb1b6}body.dark .nav button.active,body.dark .nav button:hover{background:#292b2f;color:#fff}body.dark .profile{border-color:#2b2d31}body.dark .profile:hover{background:#1d1f22}body.dark .topbar{background:color-mix(in srgb,var(--card) 88%,transparent);border-color:var(--line)}body.dark .primary{background:#f1f1f2;color:#111214;box-shadow:0 7px 18px rgba(0,0,0,.3)}body.dark .primary:hover{background:#fff;color:#000}body.dark .tag.green{background:#292b2f;color:#f1f1f2}body.dark .tag.orange{background:#383a3f;color:#e3e5e8}body.dark .tag.red{background:#482b2d;color:#ffb1b1}body.dark .event{background:#292b2f;color:#f0f1f2}body.dark .event.orange{background:#383a3f;color:#e3e5e8}body.dark .avatar{background:#55585e;color:#f4f4f5}body.dark .modal-back{background:rgba(0,0,0,.78)}body.dark .modal{box-shadow:0 24px 80px rgba(0,0,0,.62)}body.dark .stat-icon{background:#292b2f;color:#f0f1f2}body.dark .trend,body.dark .eyebrow,body.dark .link{color:#f0f1f2}body.dark .progress i{background:#f0f1f2}body.dark .content .progress i[style*="background"]{background:#aeb1b6!important}body.dark .content h2 + div[style*="height:180px"] i:nth-child(1){background:#6f7278!important}body.dark .content h2 + div[style*="height:180px"] i:nth-child(2){background:#8a8d93!important}body.dark .content h2 + div[style*="height:180px"] i:nth-child(3){background:#a7aab0!important}body.dark .content h2 + div[style*="height:180px"] i:nth-child(4){background:#c5c7cb!important}body.dark .content h2 + div[style*="height:180px"] i:nth-child(5){background:#f0f @media(max-width:900px){.sidebar{width:76px;padding:22px 10px}.brand span,.side-label,.nav button span,.profile div:not(.avatar){display:none}.nav button{justify-content:center}.content{padding:24px 18px}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.topbar{padding:0 18px}}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.stat h3{font-size:23px}.page-head{gap:14px;align-items:flex-end}.page-head h1{font-size:25px}.page-head .primary{font-size:0;padding:12px;width:42px}.page-head .primary:before{content:'+';font-size:20px}.calendar{grid-template-columns:repeat(2,1fr)}.calendar .day:nth-child(-n+2){display:none}.table th:nth-child(n+3),.table td:nth-child(n+3){display:none}.toolbar{flex-wrap:wrap}.search{max-width:none;flex-basis:100%}.row-actions{opacity:1}.session-actions{opacity:1}.session .tag{display:none}.top-actions{gap:6px}}

/* Phone and touch layouts */
@media (hover: none), (pointer: coarse) {
  .row-actions, .session-actions { opacity: 1; }
  .mini-btn { min-width: 44px; min-height: 44px; }
  .event-edit { min-width: 40px; min-height: 40px; top: 0; right: 0; }
  .event { min-height: 44px; padding: 13px 44px 10px 10px; }
}
@media (max-width: 700px) {
  .app { display: block; padding-bottom: calc(74px + env(safe-area-inset-bottom)); }
  .sidebar { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; width: 100%; height: auto; padding: 5px 4px env(safe-area-inset-bottom); display: block; border-top: 1px solid #29493b; }
  .sidebar .brand, .sidebar .side-label, .sidebar .profile { display: none; }
  .nav { display: flex; justify-content: space-around; gap: 0; }
  .nav button { flex: 1; min-width: 0; min-height: 60px; padding: 5px 1px; display: flex; flex-direction: column; justify-content: center; gap: 3px; border-radius: 9px; }
  .nav button span { display: block; }
  .nav button .icon { font-size: 19px; line-height: 22px; }
  .nav button.active, .nav button:hover { transform: none; }
  .topbar { height: 60px; padding: 0 14px; }
  .top-actions { gap: 7px; }
  .icon-btn { width: 44px; height: 44px; }
  #top-profile { padding: 3px; }
  .content { padding: 22px 14px 24px; }
  .page-head { align-items: flex-start; }
  .page-head .primary { font-size: 0; padding: 0; min-width: 44px; width: 44px; height: 44px; }
  .page-head .primary::before { content: '+'; font-size: 24px; }
  .layout { grid-template-columns: 1fr; }
  .grid.stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .calendar { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
  .calendar .day:nth-child(-n+2) { display: block; }
  .day { min-width: 0; min-height: 105px; padding: 9px; border-radius: 10px; }
  .card-head h2 { font-size: 15px; }
  .toolbar { flex-wrap: wrap; padding: 14px; }
  .search { max-width: none; flex-basis: 100%; }
  .filter { min-height: 44px; width: 100%; }
  .table-card .table, .table-card .table tbody, .table-card .table tr, .table-card .table td { display: block; width: 100%; }
  .table-card .table thead { display: none; }
  .table-card .table tr { position: relative; padding: 14px 64px 14px 14px; border-bottom: 1px solid var(--line); }
  .table-card .table td, .table-card .table td:nth-child(n+3) { display: block; padding: 3px 0; border: 0; }
  .table-card .table td:nth-child(3), .table-card .table td:nth-child(4) { display: inline-block; width: auto; margin: 7px 5px 0 0; }
  .table-card .table td:last-child { position: absolute; top: 12px; right: 12px; width: auto; }
  .table-card .table .progress { max-width: 160px; }
  .row-actions, .session-actions { opacity: 1; }
  .mini-btn { min-width: 44px; min-height: 44px; }
  .session .tag { display: inline-block; white-space: normal; }
  .session { gap: 8px; flex-wrap: wrap; }
  .session-main { min-width: 100px; }
  .modal-back { align-items: flex-end; padding: 0; }
  .modal { width: 100%; max-height: calc(100dvh - 12px); overflow-y: auto; overscroll-behavior: contain; border-radius: 18px 18px 0 0; padding: 22px 16px calc(20px + env(safe-area-inset-bottom)); }
  .form-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
  .field input, .field select, .field textarea, .search, .filter { font-size: 16px; min-height: 44px; }
  .modal-actions { position: sticky; bottom: -1px; padding: 12px 0 0; background: var(--card); }
  .modal-actions button { flex: 1; min-height: 46px; }
  .content .card > .grid[style*="repeat(3,1fr)"] { grid-template-columns: 1fr !important; }
  .toast { right: 14px; bottom: calc(85px + env(safe-area-inset-bottom)); left: 14px; text-align: center; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }


/* Final mobile polish */
.theme-btn{transition:background .48s cubic-bezier(.22,.61,.36,1),border-color .48s cubic-bezier(.22,.61,.36,1),color .48s cubic-bezier(.22,.61,.36,1),transform .48s cubic-bezier(.22,.61,.36,1)}
.theme-btn.is-switching{animation:themeIconSwitch .62s cubic-bezier(.22,.61,.36,1)}
@keyframes themeIconSwitch{0%{opacity:.45;transform:rotate(-18deg) scale(.82)}55%{opacity:1;transform:rotate(8deg) scale(1.12)}100%{opacity:1;transform:rotate(0) scale(1)}}
@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.content{animation-duration:.58s;animation-timing-function:cubic-bezier(.22,.61,.36,1)}

 .danger{color:#c6574b;background:transparent;padding:11px 4px;font-weight:700;margin-right:auto;transition:color .3s ease,transform .3s ease}.danger:hover{color:#ed6d63;transform:translateY(-1px)}body.dark .danger{color:#ff9a9a}

.modal-back.open .modal{transform:translateY(0) scale(1)}
@media(max-width:700px){.nav button::after{font-size:10px}.nav button{min-height:64px}.app{padding-bottom:calc(84px + env(safe-area-inset-bottom))}}
\n.stats{grid-template-columns:repeat(2,minmax(0,1fr));max-width:620px}.calendar-card{overflow:hidden}.calendar-toolbar{align-items:center}.calendar-title{text-align:center;display:grid;gap:5px}.calendar-title h2{margin:0;text-transform:capitalize}.calendar-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:0 12px 8px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}.calendar-weekdays span{text-align:center}.calendar{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.calendar .day{min-height:128px}.calendar .day[data-calendar-date]{cursor:pointer}.calendar .day[data-calendar-date]:hover{transform:translateY(-2px)}.client-phone{margin:3px 0 0 41px}.client-note{color:var(--muted);max-width:280px;line-height:1.4}.modal-back{display:flex;visibility:hidden;pointer-events:none}.modal-back.open{visibility:visible;pointer-events:auto}@media(max-width:700px){.stats{max-width:none;grid-template-columns:repeat(2,minmax(0,1fr))}.calendar-weekdays{padding:0 4px 6px;gap:4px;font-size:9px}.calendar{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calendar .day{min-height:86px;padding:7px 4px}.calendar .day h4{text-align:center;font-size:10px}.calendar .event{font-size:8px;padding:5px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.calendar .event-edit{display:none}.client-note{max-width:190px}.client-phone{margin-left:41px}}.install-btn{font-size:16px}.install-btn[hidden]{display:none}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="brand-mark">✦</div><span>fitpilot</span></div><div><div class="side-label">Рабочее место</div><nav class="nav"><button class="active" data-view="dashboard" data-mobile="Главная"><span class="icon">▦</span><span>Дашборд</span></button><button data-view="clients" data-mobile="Клиенты"><span class="icon">♙</span><span>Клиенты</span></button><button data-view="schedule" data-mobile="Календарь"><span class="icon">◫</span><span>Расписание</span></button></nav></div><div class="profile" id="profile-trigger"><div class="avatar" id="sidebar-avatar">АК</div><div><strong id="sidebar-name">Юлия</strong><small id="sidebar-role">Персональный тренер</small></div></div></aside>
<main class="main"><header class="topbar"><div class="crumb" id="crumb">Рабочее место / Дашборд</div><div class="top-actions"><button class="icon-btn theme-btn" id="theme-toggle" aria-label="Переключить тему" title="Переключить тему">☾</button><button class="icon-btn install-btn" id="install-app" aria-label="Установить приложение" title="Установить приложение" hidden>⇩</button><button class="icon-btn" id="top-profile" aria-label="Открыть профиль"><span class="avatar" id="top-avatar">АК</span></button></div></header><div class="content" id="app-content"></div></main>
</div>
<div class="modal-back" id="modal"><div class="modal"><h2 id="modal-title"></h2><div id="modal-body"></div></div></div><div class="toast" id="toast">Изменения сохранены</div>
<script>
const STORAGE_KEY='fitpilot-final-state-v1';
const defaults={view:'dashboard',theme:'light',profile:{firstName:'Юлия',lastName:'',role:'Персональный тренер',avatar:''},clients:[],appointments:[]};
let state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')||structuredClone(defaults);const content=document.getElementById('app-content');let modalMode='';let editingId=null;let pendingAvatar='';let touchStartX=0;let touchStartY=0;
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function initials(name){return name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function pad(value){return String(value).padStart(2,'0')}
function toIso(date){return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())}
function monthTitle(date){return date.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}
function todayIso(){return toIso(new Date())}
let calendarCursor=new Date();
function shell(title,eyebrow,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><div class="sub">${desc}</div></div>${action?`<button class="primary" id="${action.id}">${action.label}</button>`:''}</div>`}
function avatarMarkup(person,cls='avatar'){return `<div class="${cls}"${person.avatar?` style="background-image:url('${person.avatar}')"`:''}>${person.avatar?'':person.initials||initials(person.name||'АК')}</div>`}
function getClient(id){return state.clients.find(c=>c.id===Number(id))||state.clients[0]}
function dashboard(){const todayAppointments=state.appointments.filter(a=>a.date===todayIso());return shell(`Доброе утро, ${state.profile.firstName}`,'Рабочее место','Добавляйте клиентов, планируйте тренировки и ведите заметки в одном месте.',{id:'add-client',label:'+ Новый клиент'})+`<div class="grid stats"><div class="card stat"><div><p>Клиенты</p><h3>${state.clients.length}</h3><div class="trend">Готово к работе</div></div><div class="stat-icon">♙</div></div><div class="card stat"><div><p>Тренировки сегодня</p><h3>${todayAppointments.length}</h3><div class="trend">Запланировано на сегодня</div></div><div class="stat-icon">◷</div></div></div><div class="grid layout"><section class="card"><div class="card-head"><h2>Расписание на сегодня</h2><button class="link" data-view="schedule">Открыть расписание →</button></div><div class="schedule-list">${todayAppointments.map(session).join('')||'<div class="empty"><strong>Тренировок пока нет</strong><div class="sub">Добавьте первую запись в расписании.</div></div>'}</div></section><section class="card"><div class="card-head"><h2>Требуют внимания</h2><button class="link" data-view="clients">Открыть клиентов →</button></div><div class="attention"><div class="empty"><strong>Здесь появятся задачи</strong><div class="sub">Добавьте клиента, чтобы начать отслеживать его прогресс.</div></div></div></section></div><section class="card section"><div class="card-head"><h2>Последняя активность</h2></div><div class="empty"><strong>Активность появится после первого действия</strong><div class="sub">Создайте клиента или запланируйте тренировку.</div></div></section>`}
function session(a){const c=getClient(a.clientId);return `<div class="session"><div class="time">${a.time}</div><div class="session-main"><strong>${c?c.name:'Клиент удалён'}</strong><span>${a.type} · ${a.room}</span></div><span class="tag ${a.tone}">${a.status}</span><div class="session-actions"><button class="mini-btn edit-session" data-id="${a.id}" title="Редактировать">✎</button></div></div>`}
function clients(){return shell('Клиенты','Ваша база',`${state.clients.length} клиентов`,{id:'add-client',label:'+ Новый клиент'})+`<section class="card table-card"><div class="toolbar"><input class="search" id="client-search" placeholder="Поиск по имени или цели…"><select class="filter" id="client-filter"><option>Все клиенты</option><option>Активные</option><option>На паузе</option></select></div><table class="table"><thead><tr><th>Клиент</th><th>Цель и уровень</th><th>Комментарий</th><th></th></tr></thead><tbody id="client-rows">${rows(state.clients)}</tbody></table></section>`}
function rows(arr){return arr.length?arr.map(c=>`<tr><td><div class="client">${avatarMarkup(c)}<strong>${c.name}</strong></div><div class="sub client-phone">${c.phone||'Телефон не указан'}</div></td><td>${c.goal}<div class="sub">${c.level}</div></td><td><div class="client-note">${c.note||'Комментарий пока не добавлен'}</div></td><td><div class="row-actions"><button class="mini-btn edit-client" data-id="${c.id}" title="Редактировать">✎</button></div></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty"><strong>Клиентов пока нет</strong><div class="sub">Добавьте первого клиента, чтобы начать работу.</div></div></td></tr>'}
function schedule(){const year=calendarCursor.getFullYear(),month=calendarCursor.getMonth(),first=new Date(year,month,1),offset=(first.getDay()+6)%7,totalDays=new Date(year,month+1,0).getDate(),cellCount=Math.ceil((offset+totalDays)/7)*7;const cells=Array.from({length:cellCount},(_,index)=>{const dayNumber=index-offset+1;return new Date(year,month,dayNumber)});return shell('Расписание','Рабочий календарь',`Планируйте тренировки на любые даты и месяцы. Сейчас открыт ${monthTitle(calendarCursor)}.`,{id:'add-session',label:'+ Записать тренировку'})+`<div class="card calendar-card"><div class="card-head calendar-toolbar"><button class="secondary calendar-prev" aria-label="Предыдущий месяц">‹</button><div class="calendar-title"><h2>${monthTitle(calendarCursor)}</h2><button class="link calendar-today">Сегодня</button></div><button class="secondary calendar-next" aria-label="Следующий месяц">›</button></div><div class="calendar-weekdays">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(day=>`<span>${day}</span>`).join('')}</div><div class="grid calendar">${cells.map(date=>{const iso=toIso(date),inMonth=date.getMonth()===month,events=state.appointments.filter(a=>a.date===iso);return `<div class="day ${inMonth?'':'muted'} ${iso===todayIso()?'today':''}" data-calendar-date="${iso}"><h4>${date.getDate()}</h4>${events.map(a=>`<div class="event ${a.tone}" data-session="${a.id}" title="Изменить тренировку">${a.time} · ${getClient(a.clientId)?.name?.split(' ')[0]||'Клиент'}<button class="event-edit edit-session" data-id="${a.id}" title="Редактировать">✎</button></div>`).join('')}</div>`}).join('')}</div></div>`}
function generic(title,eyebrow,desc,body){return shell(title,eyebrow,desc,{id:'add-client',label:'+ Добавить'})+`<section class="card">${body}</section>`}
function render(){const views={dashboard,clients,schedule};if(!views[state.view])state.view='dashboard';content.innerHTML=views[state.view]();document.getElementById('crumb').textContent='Рабочее место / '+({dashboard:'Дашборд',clients:'Клиенты',schedule:'Расписание'}[state.view]);bind()}
function openModal(title,body,mode,id=null){modalMode=mode;editingId=id;pendingAvatar=mode==='profile'?(state.profile.avatar||''):'';document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open');modalMode='';editingId=null}
function actionButtons(cancel='Отмена',save='Сохранить',deleteAction=''){const deleteButton=deleteAction?`<button type="button" class="danger" data-delete="${deleteAction}">Удалить</button>`:'';return `<div class="modal-actions">${deleteButton}<button type="button" class="secondary close-modal">${cancel}</button><button class="primary">${save}</button></div>`}
function clientForm(c={name:'',phone:'',goal:'Снижение веса',level:'Начинающий',note:''}){return `<form id="client-form"><div class="form-grid"><div class="field"><label>Имя и фамилия</label><input required name="name" value="${c.name}" placeholder="Например, Мария Иванова"></div><div class="field"><label>Телефон</label><input name="phone" value="${c.phone||''}" placeholder="+7 900 000-00-00"></div><div class="field"><label>Цель</label><select name="goal"><option ${c.goal==='Снижение веса'?'selected':''}>Снижение веса</option><option ${c.goal==='Набор мышц'?'selected':''}>Набор мышц</option><option ${c.goal==='Общая форма'?'selected':''}>Общая форма</option><option ${c.goal==='Силовые показатели'?'selected':''}>Силовые показатели</option></select></div><div class="field"><label>Уровень</label><select name="level"><option ${c.level==='Начинающий'?'selected':''}>Начинающий</option><option ${c.level==='Средний'?'selected':''}>Средний</option><option ${c.level==='Продвинутый'?'selected':''}>Продвинутый</option></select></div><div class="field full"><label>Комментарий</label><textarea name="note" rows="3" placeholder="Цели, ограничения, важные заметки">${c.note||''}</textarea></div></div>${actionButtons('Отмена',c.id?'Сохранить изменения':'Сохранить клиента',c.id?'client:'+c.id:'')}</form>`}
function sessionForm(a={time:'',date:toIso(calendarCursor),clientId:state.clients[0]?.id||'',type:'Персональная тренировка',room:'Зал 1',status:'Запланирована',tone:'green'}){const clientOptions=state.clients.length?state.clients.map(c=>`<option value="${c.id}" ${Number(a.clientId)===c.id?'selected':''}>${c.name}</option>`).join(''):'<option value="">Сначала добавьте клиента</option>';return `<form id="session-form"><div class="form-grid"><div class="field full"><label>Клиент</label><select required name="clientId">${clientOptions}</select></div><div class="field"><label>Дата</label><input required type="date" name="date" value="${a.date||toIso(calendarCursor)}"></div><div class="field"><label>Время</label><input required type="time" name="time" value="${a.time}"></div><div class="field"><label>Формат</label><input name="type" value="${a.type}"></div><div class="field"><label>Зал</label><input name="room" value="${a.room}"></div><div class="field full"><label>Статус тренировки</label><select name="status"><option ${a.status==='Запланирована'?'selected':''}>Запланирована</option><option ${a.status==='Проведена'?'selected':''}>Проведена</option><option ${a.status==='Отменена'?'selected':''}>Отменена</option><option ${a.status==='Не пришёл'?'selected':''}>Не пришёл</option></select></div></div>${actionButtons('Отмена',a.id?'Сохранить изменения':'Записать тренировку',a.id?'session:'+a.id:'')}</form>`}
function profileForm(){const p=state.profile;return `<form id="profile-form"><div class="profile-preview">${avatarMarkup({name:p.firstName+' '+p.lastName,initials:initials(p.firstName+' '+p.lastName),avatar:p.avatar},'avatar')}<div><strong>${p.firstName} ${p.lastName}</strong><div class="hint">Выберите фото с устройства, чтобы обновить аватар</div></div></div><div class="form-grid"><div class="field"><label>Имя</label><input required name="firstName" value="${p.firstName}"></div><div class="field"><label>Фамилия</label><input required name="lastName" value="${p.lastName}"></div><div class="field full"><label>Роль</label><input name="role" value="${p.role}"></div><div class="field full"><label>Фото профиля</label><input type="file" accept="image/*" id="profile-photo" name="photo"></div></div>${actionButtons('Отмена','Сохранить профиль')}</form>`}
function bind(){
  const addClient=document.getElementById('add-client');
  if(addClient)addClient.onclick=()=>openModal('Новый клиент',clientForm(),'client');
  const addSession=document.getElementById('add-session');
  if(addSession)addSession.onclick=()=>openModal('Новая тренировка',sessionForm(),'session');
  const search=document.getElementById('client-search');
  const filter=document.getElementById('client-filter');
  function updateRows(){
    const query=search.value.trim().toLowerCase(), choice=filter.value;
    const visible=state.clients.filter(c=>{
      const matchesQuery=(c.name+' '+c.goal).toLowerCase().includes(query);
      const matchesFilter=choice==='Все клиенты'||(choice==='Активные'&&c.status==='Активен')||(choice==='На паузе'&&c.status==='На паузе')||(choice==='Ожидают оплату'&&c.payment==='Ожидает оплату');
      return matchesQuery&&matchesFilter;
    });
    document.getElementById('client-rows').innerHTML=rows(visible);
  }
  if(search&&filter){search.oninput=updateRows;filter.onchange=updateRows;}
}
const viewOrder=['dashboard','clients','schedule'];
function goToView(view){state.view=view;document.querySelectorAll('.nav button').forEach(n=>n.classList.toggle('active',n.dataset.view===state.view));render();content.style.animation='none';void content.offsetWidth;content.style.animation='';window.scrollTo({top:0,behavior:'auto'});}
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-view]');
  if(nav){goToView(nav.dataset.view);return;}
  const deleteButton=e.target.closest('[data-delete]');
  if(deleteButton){const [kind,id]=deleteButton.dataset.delete.split(':');const label=kind==='client'?'клиента':'тренировку';if(!confirm(`Удалить ${label}? Это действие нельзя отменить.`))return;if(kind==='client'){state.clients=state.clients.filter(c=>c.id!==Number(id));state.appointments=state.appointments.filter(a=>a.clientId!==Number(id));}else{state.appointments=state.appointments.filter(a=>a.id!==Number(id));}saveState();closeModal();render();notify(kind==='client'?'Клиент удалён':'Тренировка удалена');return;}
  const prev=e.target.closest('.calendar-prev'); if(prev){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()-1,1);render();return;}
  const next=e.target.closest('.calendar-next'); if(next){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+1,1);render();return;}
  const today=e.target.closest('.calendar-today'); if(today){calendarCursor=new Date();render();return;}
  const clientButton=e.target.closest('.edit-client');
  if(clientButton){const client=getClient(clientButton.dataset.id);openModal('Редактировать клиента',clientForm(client),'client',client.id);return;}
  const sessionButton=e.target.closest('.edit-session,[data-session]');
  if(sessionButton){const appointment=state.appointments.find(a=>a.id===Number(sessionButton.dataset.id||sessionButton.dataset.session));if(appointment)openModal('Редактировать тренировку',sessionForm(appointment),'session',appointment.id);return;}
  if(e.target.id==='modal'||e.target.closest('.close-modal'))closeModal();
});
document.addEventListener('change',e=>{if(e.target.id==='profile-photo'&&e.target.files[0]){const reader=new FileReader();reader.onload=()=>{pendingAvatar=reader.result;const preview=document.querySelector('.profile-preview .avatar');if(preview){preview.style.backgroundImage=`url('${pendingAvatar}')`;preview.textContent='';}};reader.readAsDataURL(e.target.files[0]);}});
document.addEventListener('touchstart',e=>{if(document.getElementById('modal').classList.contains('open')||e.target.closest('input,textarea,select'))return;const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(document.getElementById('modal').classList.contains('open'))return;const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.abs(dx)<70||Math.abs(dx)<=Math.abs(dy))return;const index=viewOrder.indexOf(state.view),next=viewOrder[index+(dx<0?1:-1)];if(next)goToView(next);},{passive:true});
document.addEventListener('submit',e=>{
  if(e.target.id==='client-form'){e.preventDefault();const d=new FormData(e.target),name=d.get('name').trim();if(!name)return;const payload={name,phone:d.get('phone'),goal:d.get('goal'),level:d.get('level'),note:d.get('note'),initials:initials(name)};if(editingId){Object.assign(getClient(editingId),payload);notify('Изменения клиента сохранены');}else{state.clients.push({id:Date.now(),...payload});notify('Клиент добавлен');}saveState();closeModal();render();}
  if(e.target.id==='session-form'){e.preventDefault();const d=new FormData(e.target),payload={clientId:Number(d.get('clientId')),date:d.get('date'),time:d.get('time'),type:d.get('type'),room:d.get('room'),status:d.get('status'),tone:d.get('status')==='Проведена'?'green':'orange'};if(editingId){Object.assign(state.appointments.find(a=>a.id===editingId),payload);notify('Тренировка обновлена');}else{state.appointments.push({id:Date.now(),...payload});notify('Тренировка добавлена');}saveState();closeModal();render();}
  if(e.target.id==='profile-form'){e.preventDefault();const d=new FormData(e.target);state.profile={firstName:d.get('firstName'),lastName:d.get('lastName'),role:d.get('role'),avatar:pendingAvatar||state.profile.avatar||''};saveState();closeModal();updateProfile();render();notify('Профиль обновлён');}
});
document.getElementById('profile-trigger').onclick=()=>openModal('Мой профиль',profileForm(),'profile');
document.getElementById('top-profile').onclick=()=>openModal('Мой профиль',profileForm(),'profile');
function updateProfile(){const p=state.profile;const name=(p.firstName+' '+p.lastName).trim();document.getElementById('sidebar-name').textContent=name;document.getElementById('sidebar-role').textContent=p.role;['sidebar-avatar','top-avatar'].forEach(id=>{const el=document.getElementById(id);el.textContent=p.avatar?'':initials(name);el.style.backgroundImage=p.avatar?`url('${p.avatar}')`:''})}
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function applyTheme(animate=true){const button=document.getElementById('theme-toggle');const change=()=>{document.body.classList.toggle('dark',state.theme==='dark');button.textContent=state.theme==='dark'?'☀':'☾';button.title=state.theme==='dark'?'Включить светлую тему':'Включить тёмную тему';if(animate){button.classList.remove('is-switching');void button.offsetWidth;button.classList.add('is-switching');setTimeout(()=>button.classList.remove('is-switching'),620)}};if(animate&&document.startViewTransition){document.startViewTransition(change)}else{change()}}
document.getElementById('theme-toggle').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';saveState();applyTheme(true)};updateProfile();applyTheme(false);render();
let deferredInstallPrompt=null;const installButton=document.getElementById('install-app');window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;installButton.hidden=false});installButton.addEventListener('click',async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installButton.hidden=true});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installButton.hidden=true});if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./fitpilot-sw.js').catch(()=>{})}
</script>
</body></html>
